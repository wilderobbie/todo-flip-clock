        <button id="collapseBtn" class="icon-btn" title="">
          <span data-icon="panel-left-close"></span>
        </button>
      </div>

      <nav class="side-nav">
        <button class="nav-item" data-view="flipclock">
          <span data-icon="clock"></span>
          <span class="nav-label" data-i18n="navFlip">翻页时钟</span>
        </button>
        <button class="nav-item" data-view="pomodoro">
          <span data-icon="timer"></span>
          <span class="nav-label" data-i18n="navPomodoro">番茄时钟</span>
        </button>
      </nav>

      <div class="side-foot">
        <button class="nav-item" data-view="settings">
          <span data-icon="settings"></span>
          <span class="nav-label" data-i18n="navSettings">设置</span>
        </button>
      </div>
    </aside>

    <!-- ===================== 主内容 ===================== -->
    <main id="main">

      <!-- 主界面：格言警句 -->
      <section class="view" id="view-home">
        <div class="motto-wrap">
          <p id="mottoText" class="motto-text"></p>
          <p id="mottoFrom" class="motto-from"></p>
        </div>
      </section>

      <!-- 翻页时钟 -->
      <section class="view" id="view-flipclock">
        <div class="clock-stage" id="clockStage">
          <div class="clock-row" id="clockRow">
            <div class="flip-unit" id="fu-h"></div>
            <div class="flip-unit" id="fu-m"></div>
            <div class="flip-unit" id="fu-s"></div>
          </div>
          <div class="clock-date" id="clockDate"></div>

          <button id="flipFsBtn" class="corner-btn fs-btn" title="全屏">
            <span data-icon="maximize"></span>
          </button>
          <button id="flipSettingsBtn" class="corner-btn" title="">
            <span data-icon="settings"></span>
          </button>

          <!-- 右侧滑出面板 -->
          <div class="side-panel" id="flipPanel">
            <div class="panel-head">
              <span data-i18n="pTitle">设置</span>
              <button class="icon-btn" id="flipPanelClose"><span data-icon="x"></span></button>
            </div>

            <div class="panel-group">
              <div class="panel-row">
                <span class="panel-label" data-i18n="fFormat">时钟格式</span>
                <div class="seg" id="formatSeg">
                  <button data-format="24" data-i18n="f24h">24 小时</button>
                  <button data-format="12" data-i18n="f12h">12 小时</button>
                </div>
              </div>

              <div class="panel-row">
                <span class="panel-label" data-i18n="fRatio">翻页比例</span>
                <input type="range" id="ratioSlider" min="0" max="100" value="50">
              </div>

              <div class="panel-row">
                <span class="panel-label" data-i18n="fBrightness">亮度</span>
                <input type="range" id="brightnessSlider" min="0" max="100" value="100">
              </div>

              <div class="panel-row">
                <span class="panel-label" data-i18n="fSound">翻页声音</span>
                <label class="switch"><input type="checkbox" id="soundToggle" checked><span class="slider"></span></label>
              </div>

              <div class="panel-row">
                <span class="panel-label" data-i18n="fDate">显示日期</span>
                <label class="switch"><input type="checkbox" id="dateToggle" checked><span class="slider"></span></label>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 番茄时钟 -->
      <section class="view" id="view-pomodoro">
        <div class="clock-stage pomo-stage" id="pomoStage">
          <div class="pomo-center">
            <div class="pomo-ring">
              <svg viewBox="0 0 320 320">
                <circle class="ring-track" cx="160" cy="160" r="140"></circle>
                <circle class="ring-bar" id="ringBar" cx="160" cy="160" r="140"></circle>
              </svg>
              <div class="ring-inner">
                <div class="pomo-time" id="pomoTime">25:00</div>
                <div class="pomo-status" id="pomoStatus"></div>
                <div class="pomo-round" id="pomoRound"></div>
              </div>
            </div>

            <div class="pomo-actions">
              <button class="pomo-btn primary" id="startPauseBtn">
                <span data-icon="play"></span><span id="startPauseLabel" data-i18n="pStart">开始</span>
              </button>
              <button class="pomo-btn" id="resetBtn" title="">
                <span data-icon="rotate-ccw"></span><span data-i18n="pReset">重置</span>
              </button>
              <button class="pomo-btn warn" id="interruptBtn">
                <span data-icon="flag"></span><span data-i18n="pInterrupt">记录中断</span>
              </button>
            </div>
          </div>

          <button id="pomoFsBtn" class="corner-btn fs-btn" title="全屏">
            <span data-icon="maximize"></span>
          </button>
          <button id="pomoSettingsBtn" class="corner-btn" title="">
            <span data-icon="settings"></span>
          </button>

          <!-- 右侧滑出面板 -->
          <div class="side-panel wide" id="pomoPanel">
            <div class="panel-head">
              <span data-i18n="pTitle">设置</span>
              <button class="icon-btn" id="pomoPanelClose"><span data-icon="x"></span></button>
            </div>

            <div class="panel-scroll">
              <!-- 计时设置 -->
              <div class="panel-sec">
                <h4 data-i18n="mTiming">计时设置</h4>
                <div class="preset-list" id="presetList">
                  <button class="preset" data-preset="standard">
                    <span class="p-name" data-i18n="mStandard">标准番茄</span>
                    <span class="p-desc">4 × 25 min · 5 min</span>
                  </button>
                  <button class="preset" data-preset="deep">
                    <span class="p-name" data-i18n="mDeep">深度工作</span>
                    <span class="p-desc">4 × 50 min · 10 min</span>
                  </button>
                  <button class="preset" data-preset="sprint">
                    <span class="p-name" data-i18n="mSprint">冲刺模式</span>
                    <span class="p-desc">8 × 15 min · 3 min</span>
                  </button>
                  <button class="preset" data-preset="custom" id="customPreset">
                    <span class="p-name" data-i18n="mCustom">自定义</span>
                    <div class="custom-fields">
                      <label><span data-i18n="mFocusLen">专注(分)</span><input type="number" id="customFocus" min="1" max="180" value="25"></label>
                      <label><span data-i18n="mRestLen">休息(分)</span><input type="number" id="customRest" min="1" max="60" value="5"></label>
                      <label><span data-i18n="mRounds">轮数</span><input type="number" id="customRounds" min="1" max="16" value="4"></label>
                    </div>
                  </button>
                </div>
                <button class="apply-btn" id="applyCustomBtn" data-i18n="mApply">应用设置</button>
              </div>

              <!-- 今日统计 -->
              <div class="panel-sec">
                <h4 data-i18n="mStats">今日统计</h4>
                <div class="stat-row"><span data-i18n="mDone">已完成番茄</span><b id="statDone">0</b></div>
                <div class="stat-row"><span data-i18n="mFocus">专注时长</span><b id="statFocus">0 分钟</b></div>
                <div class="stat-row"><span data-i18n="mInterrupt">中断时长</span><b id="statInterrupt">0 分钟</b></div>
              </div>

              <!-- 成就徽章 -->
              <div class="panel-sec">
                <h4 data-i18n="mBadge">成就徽章</h4>
                <div class="badge" id="badge-perseverance">
                  <span data-icon="star"></span>
                  <div><b data-i18n="bPerseverance">毅力之星</b><small data-i18n="bPerseveranceCond">今日完成 ≥ 8 个番茄</small></div>
                </div>
                <div class="badge" id="badge-focus">
                  <span data-icon="medal"></span>
                  <div><b data-i18n="bFocus">专注达人</b><small data-i18n="bFocusCond">今日专注 ≥ 120 分钟</small></div>
                </div>
                <div class="badge" id="badge-efficiency">
                  <span data-icon="zap"></span>
                  <div><b data-i18n="bEfficiency">效率专家</b><small data-i18n="bEfficiencyCond">完成 ≥ 4 番茄且中断 ≤ 1 次</small></div>
                </div>
              </div>

              <!-- 显示比例 -->
              <div class="panel-sec">
                <h4 data-i18n="mScale">显示比例</h4>
                <div class="panel-row">
                  <span class="panel-label" data-i18n="mRingScale">时钟比例</span>
                  <input type="range" id="ringSlider" min="0" max="100" value="50">
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 设置界面 -->
      <section class="view" id="view-settings">
        <div class="settings-page">
          <h2 data-i18n="sGeneral">通用</h2>
          <div class="card">
            <div class="row">
              <div>
                <div class="row-title" data-i18n="sLanguage">语言</div>
                <div class="row-desc" data-i18n="sLanguageDesc">切换应用界面显示语言。</div>
              </div>
              <div class="seg" id="langSeg">
                <button data-lang="zh" data-i18n="lZh">简体中文</button>
                <button data-lang="en" data-i18n="lEn">English</button>
              </div>
            </div>
          </div>

          <h2 data-i18n="sAppearance">外观</h2>
          <div class="card">
            <div class="row">
              <div>
                <div class="row-title" data-i18n="sTheme">主题</div>
                <div class="row-desc" data-i18n="sThemeDesc">选择应用的配色方案。</div>
              </div>
              <div class="seg" id="themeSeg">
                <button data-theme-choice="dark" data-i18n="tDark">全黑</button>
                <button data-theme-choice="light" data-i18n="tLight">全白</button>
                <button data-theme-choice="system" data-i18n="tSystem">跟随系统</button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div id="toast"></div>

  <script src="flipclock.js"></script>
  <script src="pomodoro.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
